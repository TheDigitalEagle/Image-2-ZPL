name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    # Windows so that the System.Drawing adapter's net472 target can build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet test Image2ZPL.sln --configuration Release

      - run: dotnet pack Image2ZPL.sln --configuration Release --output artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
